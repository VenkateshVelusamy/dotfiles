# ============================================================================
# PREFIX  (tmux's "leader" — press this first, then a command key)
# ============================================================================
# Ctrl-Space, chosen to echo nvim's Space leader. Ctrl-b is unbound.
# Press Ctrl-Space twice to send a literal Ctrl-Space to the program inside.
set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

# ============================================================================
# TERMINAL / COLORS  (true color + undercurl, so nvim renders correctly)
# ============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Near-eliminates the ESC lag when leaving insert mode in nvim.
set -sg escape-time 10
# Lets nvim autoread/autosave-on-focus fire correctly inside tmux.
set -g focus-events on
# Window for chained repeatable (-r) keys like pane-resize; 1s matches nvim/wezterm.
set -g repeat-time 1000

set -g mouse on

# ============================================================================
# QUALITY OF LIFE
# ============================================================================
set -g base-index 1            # windows start at 1 (matches the 1 key)
set -g pane-base-index 1       # panes start at 1
set -g renumber-windows on     # close a window, no numbering gaps
set -g detach-on-destroy off   # last window closed -> hop to another session
set -g history-limit 50000     # deep scrollback
set -g display-time 2000       # status messages linger 2s
set -g set-clipboard on        # tmux copy -> system clipboard (OSC52)

# ============================================================================
# SMART PANE NAVIGATION  (nvim <-> tmux, no plugin)
# ============================================================================
# Your nvim maps <C-h/j/k/l> to TmuxNavigate*. These bare (prefix-less) binds
# are the tmux half: if the current pane runs nvim, pass the key through so
# nvim moves between its splits; otherwise switch tmux panes. Result: one set
# of keys glides across both.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# Reach these from copy-mode too.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ============================================================================
# SPLITS  (mirror your nvim <leader>sv / <leader>sh)
# ============================================================================
# prefix s v  = vertical split (side by side) — matches nvim <leader>sv
# prefix s h  = horizontal split (stacked)     — matches nvim <leader>sh
# New pane opens in the current pane's directory.
unbind '"'
unbind %
bind s switch-client -T SPLIT
bind-key -T SPLIT v split-window -h -c "#{pane_current_path}"
bind-key -T SPLIT h split-window -v -c "#{pane_current_path}"

# ============================================================================
# PANE RESIZE  (prefix, then vim h/j/k/l — repeatable, hold to keep resizing)
# ============================================================================
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z   # toggle zoom (fullscreen this pane)

# ============================================================================
# COPY MODE  (vim motions — matches your muscle memory)
# ============================================================================
# prefix [  enters copy mode; v starts selection, y yanks, then q to exit.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane   # don't drop copy mode on mouse-drag

# ============================================================================
# RELOAD
# ============================================================================
# prefix r  re-sources this file after edits.
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# POPUPS
# ============================================================================
# prefix g  floats lazygit over the current pane's directory (needs lazygit).
bind g display-popup -d "#{pane_current_path}" -E -w 81% -h 80% lazygit

# prefix ?  floats this config's cheat sheet (q to close).
bind ? display-popup -E -w 80% -h 80% "less ~/.tmux-cheatsheet.md"

# ============================================================================
# STATUS LINE  (from-scratch theme, ported from radleylewis; nerd-font glyphs)
# ============================================================================
set-option -g status-position top
set -g status-style bg='#1b1e37',fg='#e1e1e2'
set -g message-style bg='#030b1e',fg='#e2c779'
set -g pane-border-style fg='#696969'
set -g pane-active-border-style fg='#e2c779'
set -g mode-style bg='#e2c779',fg='#1b1e37'
set -g status-interval 5

set -g status-left-length 60
set -g status-left "#[fg=#1b1e37,bg=#e2c779,bold] #S #[fg=#e2c779,bg=#1b1e37]"

set -g status-right-length 120
set -g status-right "#[fg=#e1e1e2,bg=#1b1e37] 󰥔 %H:%M #[fg=#696969]󰃭 %Y-%m-%d #[fg=#ff6b8a] 󰅒 #(whoami)@#H "

set -g window-status-format "#[fg=#696969] 󰈚 #I:#W "
set -g window-status-current-format "#[fg=#e1e1e2,bg=#030b1e,bold] 󰈚 #I:#W #[default]"
set -g window-status-separator ""

# ============================================================================
# PLUGINS  (TPM)  — install once: prefix + I
# ============================================================================
# tmux-resurrect/continuum persist + auto-restore sessions across reboots;
# tmux-yank hardens system-clipboard copy across platforms.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Keep this at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
